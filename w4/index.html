<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>網友對我的動態留言板</title>
  <style>
    /* =========================================================
       1. 全局與主題變數設定 (方便後續修改顏色與風格)
       ========================================================= */
    :root {
      /* 背景與主要顏色 */
      --bg-color: #0d0f12;           /* 全局背景色 (極深藍灰) */
      --card-bg: #161920;            /* 卡片背景色 */
      --text-color: #e2e8f0;          /* 主要文字顏色 */
      --text-muted: #94a3b8;         /* 次要/時間文字顏色 */

      /* 【關鍵特效顏色設定】 */
      --accent-color: #00f2fe;       /* 亮起卡片的邊框與發光顏色 (螢光藍) */
      --accent-glow: rgba(0, 242, 254, 0.4); /* 發光暈染顏色 */

      /* 動畫與轉換時間 */
      --transition-speed: 0.5s;     /* 卡片切換 Highlight 的過渡時間 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      padding: 20px;
    }

    /* 頁面標題區塊 */
    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px 0;
    }

    header h1 {
      font-size: 2.2rem;
      letter-spacing: 2px;
      background: linear-gradient(45deg, #00f2fe, #4facfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* =========================================================
       2. 酷炫載入動畫 (Loading Animation)
       ========================================================= */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 0;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin-bottom: 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #loading p {
      color: var(--accent-color);
      letter-spacing: 1.5px;
      font-weight: bold;
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.5; }
      to { opacity: 1; }
    }

    /* =========================================================
       3. 瀑布流排版 (Masonry Layout via CSS Column-Count)
       ========================================================= */
    .masonry-container {
      /* 依據螢幕寬度自動調整欄數 */
      column-count: 4;         /* 預設大螢幕顯示 4 欄 */
      column-gap: 20px;        /* 欄位之間的間距 */
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* 響應式斷點設定 */
    @media (max-width: 1200px) { .masonry-container { column-count: 3; } }
    @media (max-width: 800px)  { .masonry-container { column-count: 2; } }
    @media (max-width: 500px)  { .masonry-container { column-count: 1; } }

    /* =========================================================
       4. 卡片樣式與焦點 (Highlight) 特效
       ========================================================= */
    .card {
      background-color: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      break-inside: avoid; /* 避免卡片在欄位分割處被截斷 */
      
      /* 設定滑順的過渡效果 */
      transition: transform var(--transition-speed) ease,
                  border-color var(--transition-speed) ease,
                  box-shadow var(--transition-speed) ease,
                  opacity var(--transition-speed) ease,
                  filter var(--transition-speed) ease;

      /* 預設非亮起狀態：稍微變暗與模糊 */
      opacity: 0.6;
      filter: blur(1px);
      transform: scale(0.98);
    }

    /* 【亮起亮焦點狀態 (Highlight)】 */
    .card.highlight {
      opacity: 1;
      filter: blur(0px);
      transform: scale(1.05); /* 放大 5% */
      border-color: var(--accent-color); /* 邊框變亮 */
      box-shadow: 0 0 20px var(--accent-glow), 0 8px 25px rgba(0, 0, 0, 0.5); /* 外發光特效 */
      z-index: 10;
      position: relative;
    }

    /* 卡片頭部 (暱稱 + 時間) */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .card-author {
      font-weight: bold;
      font-size: 1.1rem;
      color: #fff;
    }

    .card-time {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* 卡片留言內容 */
    .card-body {
      font-size: 0.95rem;
      line-height: 1.6;
      white-space: pre-wrap; /* 保持原留言的換行符號 */
      word-break: break-word;
    }
  </style>
</head>
<body>

  <header>
    <h1>留言藝廊 ‧ 動態展示</h1>
    <p>來自網友們的點滴祝福與留言</p>
  </header>

  <!-- 讀取中酷炫動畫 -->
  <div id="loading">
    <div class="spinner"></div>
    <p>讀取留言中…</p>
  </div>

  <!-- 瀑布流留言卡片容器 -->
  <div id="masonry" class="masonry-container"></div>

  <script>
    // =========================================================
    // 5. JavaScript 控制邏輯
    // =========================================================

    // 【修改輪播秒數】：此處設定每幾秒切換下一張卡片 (單位：毫秒，3000 = 3秒)
    const ROTATE_INTERVAL_MS = 3000;

    // Google 試算表 CSV 發布網址
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTM84TitRkptwVp-kAbiyztQ71bz-mvoRqQP4CTRjAJ7nQxPimpjBQfpAvZH6OYQPwXDnxJncilEXux/pub?output=csv';

    let currentHighlightIndex = 0; // 目前亮起的卡片索引
    let highlightTimer = null;     // 計時器物件

    /**
     * CSV 解析函數 (防範留言內容包含逗號與換行)
     * 能正確解析標準的 CSV 格式字串
     */
    function parseCSV(text) {
      const lines = [];
      let row = [];
      let inQuotes = false;
      let currentVal = '';

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (inQuotes && nextChar === '"') {
            currentVal += '"';
            i++; // 跳過下一個雙引號
          } else {
            inQuotes = !inQuotes; // 切換引號狀態
          }
        } else if (char === ',' && !inQuotes) {
          row.push(currentVal.trim());
          currentVal = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          if (char === '\r' && nextChar === '\n') {
            i++; // 處理 \r\n
          }
          row.push(currentVal.trim());
          if (row.length > 0 && row.some(item => item !== '')) {
            lines.push(row);
          }
          row = [];
          currentVal = '';
        } else {
          currentVal += char;
        }
      }
      if (currentVal || row.length > 0) {
        row.push(currentVal.trim());
        lines.push(row);
      }
      return lines;
    }

    /**
     * 渲染卡片至 HTML 畫面
     */
    function renderCards(data) {
      const container = document.getElementById('masonry');
      container.innerHTML = ''; // 清空容器

      // 第一行為標題欄（時間標記、你的名字/暱稱、你想對我說的話），故從 i = 1 開始
      for (let i = 1; i < data.length; i++) {
        const [time, name, content] = data[i];

        // 過濾掉空行或資料不齊全的項目
        if (!content && !name) continue;

        const card = document.createElement('div');
        card.className = 'card';

        // 組合卡片內部 HTML 結構
        card.innerHTML = `
          <div class="card-header">
            <span class="card-author">${escapeHTML(name || '無名氏')}</span>
            <span class="card-time">${escapeHTML(time || '')}</span>
          </div>
          <div class="card-body">${escapeHTML(content || '')}</div>
        `;

        container.appendChild(card);
      }
    }

    /**
     * 防止 XSS 攻擊的字串轉義函數
     */
    function escapeHTML(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    /**
     * 啟動隨時間輪播亮起（Highlight）的特效
     */
    function startHighlightRotation() {
      const cards = document.querySelectorAll('.card');
      if (cards.length === 0) return;

      // 預設讓第一張卡片亮起
      cards[0].classList.add('highlight');

      // 設定定時器，每隔指定時間輪播一次
      highlightTimer = setInterval(() => {
        // 移除上一張卡片的 highlight
        cards[currentHighlightIndex].classList.remove('highlight');

        // 計算下一張卡片索引 (循環)
        currentHighlightIndex = (currentHighlightIndex + 1) % cards.length;

        // 讓下一張卡片亮起
        const nextCard = cards[currentHighlightIndex];
        nextCard.classList.add('highlight');

        // 順暢地自動捲動頁面以保持亮起卡片在視野範圍內（視需求開啟）
        // nextCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      }, ROTATE_INTERVAL_MS);
    }

    /**
     * 主程式初始化：使用 fetch 取回 Google 試算表 CSV
     */
    async function init() {
      const loadingEl = document.getElementById('loading');

      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error('網路請求失敗');

        const csvText = await response.text();
        const parsedData = parseCSV(csvText);

        // 隱藏讀取動畫
        loadingEl.style.display = 'none';

        // 渲染卡片
        renderCards(parsedData);

        // 開始自動輪播特效
        startHighlightRotation();

      } catch (error) {
        console.error('讀取 CSV 資料時發生錯誤:', error);
        loadingEl.innerHTML = '<p style="color:#ff5555;">資料載入失敗，請稍後再試。</p>';
      }
    }

    // 當 DOM 載入完成後執行
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
