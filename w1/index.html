<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人數位名片</title>
    <!-- 載入 FontAwesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 全局重置與基底樣式 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            /* 馬卡龍粉藍與粉紫漸層背景 */
            background: linear-gradient(135deg, #ffd1dc 0%, #e8dff5 50%, #fce1e4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 名片卡片本體 */
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 340px;
            padding: 40px 28px;
            border-radius: 28px;
            text-align: center;
            /* 現代感柔和雙層微陰影 */
            box-shadow: 
                0 10px 25px rgba(230, 175, 190, 0.3),
                0 4px 10px rgba(0, 0, 0, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.8);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 15px 30px rgba(220, 160, 180, 0.4),
                0 6px 15px rgba(0, 0, 0, 0.04);
        }

        /* 1. 圓形大頭貼外框與圖片 */
        .avatar-wrapper {
            width: 110px;
            height: 110px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            padding: 4px;
            /* 馬卡龍粉黃與粉紅外圈漸層 */
            background: linear-gradient(135deg, #fcf4dd 0%, #ffc0cb 100%);
            box-shadow: 0 4px 12px rgba(255, 192, 203, 0.4);
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        /* 2. 名字與自我介紹 */
        .name {
            font-size: 1.6rem;
            font-weight: 700;
            color: #5a4b5c;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .bio {
            font-size: 0.92rem;
            color: #8c7b8e;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* 3. 按鈕區域配置 */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px;
            border-radius: 16px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.25s ease;
        }

        /* Instagram 按鈕：粉蜜桃色系 */
        .btn-instagram {
            background-color: #ffb7b2;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(255, 183, 178, 0.4);
        }

        .btn-instagram:hover {
            background-color: #ffa49e;
            transform: scale(1.02);
            box-shadow: 0 6px 16px rgba(255, 183, 178, 0.5);
        }

        /* Email 按鈕：馬卡龍薄荷/霧藍色系 */
        .btn-email {
            background-color: #b5ead7;
            color: #2d5a4c;
            box-shadow: 0 4px 12px rgba(181, 234, 215, 0.4);
        }

        .btn-email:hover {
            background-color: #a2e3ce;
            transform: scale(1.02);
            box-shadow: 0 6px 16px rgba(181, 234, 215, 0.5);
        }
    </style>
</head>
<body>

    <!-- 主名片卡片容器 -->
    <div class="card">
        <!-- 1. 圓形大頭貼照片 -->
        <div class="avatar-wrapper">
            <img src="https://i.postimg.cc/ryRcvpRS/26d61247c88148df1190.jpg" alt="大頭貼" class="avatar">
        </div>

        <!-- 2. 名字與簡短自我介紹 -->
        <h1 class="name">heling</h1>
        <p class="bio">熱愛生活與設計的新手創作者 🌸 正在探索網頁美學的世界！</p>

        <!-- 3. 按鈕區塊 (Instagram & Email) -->
        <div class="button-group">
            <a href="https://instagram.com/hnelig07" target="_blank" class="btn btn-instagram">
                <i class="fa-brands fa-instagram"></i> Instagram
            </a>
            <a href="mailto:hal531718@gmail.com" class="btn btn-email">
                <i class="fa-regular fa-envelope"></i> Email
            </a>
        </div>
    </div>

</body>
</html>
