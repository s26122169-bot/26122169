<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人數位名片</title>
    <!-- 載入 FontAwesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 主名片卡片容器 -->
    <div class="card">
        <!-- 1. 圓形大頭貼照片 -->
        <div class="avatar-wrapper">
            <img src="https://i.postimg.cc/ryRcvpRS/26d61247c88148df1190.jpg" alt="大頭貼" class="avatar">
        </div>

        <!-- 2. 名字與簡短自我介紹 -->
        <h1 class="name">heling</h1>
        <p class="bio">熱愛生活與設計的新手創作者 🌸 正在探索網頁美學的世界！</p>

        <!-- 3. 按鈕區塊 (Instagram & Email) -->
        <div class="button-group">
            <a href="hnelig07" target="_blank" class="btn btn-instagram">
                <i class="fa-brands fa-instagram"></i> Instagram
            </a>
            <a href="hal531718@gmail.com" class="btn btn-email">
                <i class="fa-regular fa-envelope"></i> Email
            </a>
        </div>
    </div>

</body>
</html>
