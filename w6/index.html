<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SnapVote｜拍照二選一投票器</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Noto Sans TC & Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
      background-color: #F8FAFC;
      -webkit-tap-highlight-color: transparent;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.7; }
      70% { transform: scale(1.05); opacity: 0; }
      100% { transform: scale(0.95); opacity: 0; }
    }
    .winner-glow {
      box-shadow: 0 0 0 4px #10B981, 0 20px 25px -5px rgba(16, 185, 129, 0.25);
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col items-center pb-12">

  <!-- 頂部導覽列 -->
  <header class="w-full max-w-md px-5 pt-5 pb-3 flex items-center justify-between sticky top-0 z-30 bg-[#F8FAFC]/90 backdrop-blur-md">
    <div class="flex items-center gap-2.5 cursor-pointer" onclick="switchToCreateMode()">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md shadow-indigo-200">
        <i data-lucide="camera" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="text-lg font-black tracking-tight text-slate-900 leading-none">SnapVote</h1>
        <p class="text-[11px] font-medium text-slate-400 mt-0.5">拍照二選一・即時決策</p>
      </div>
    </div>

    <!-- 右上角隱藏管理員彩蛋觸發區 (連點 5 下) -->
    <div class="flex items-center gap-2">
      <button id="btn-new-poll-top" onclick="switchToCreateMode()" class="hidden text-xs font-bold px-3 py-1.5 rounded-full bg-slate-200/70 hover:bg-slate-200 text-slate-700 transition">
        + 發起新投票
      </button>
      <span id="secret-trigger" onclick="handleSecretTap()" class="select-none cursor-pointer text-[11px] font-bold px-2.5 py-1 rounded-full bg-slate-100 text-slate-400 active:scale-95 transition">
        v1.0
      </span>
    </div>
  </header>

  <!-- 主容器 -->
  <main class="w-full max-w-md px-4 mt-2 flex-1">

    <!-- ==================== 視圖 1：建立投票模式 ==================== -->
    <section id="view-create" class="space-y-5">
      <div class="glass-card rounded-3xl p-5 shadow-sm space-y-5">
        <!-- 投票題目 -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">
            01. 幫你決定什麼事？
          </label>
          <input id="input-title" type="text" maxlength="40" placeholder="例如：今晚吃哪一間？ / 哪件外套好看？"
            class="w-full px-4 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 text-slate-900 font-bold placeholder:font-normal placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition" />
        </div>

        <!-- 拍照上傳 A / B 區 -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-xs font-bold uppercase tracking-wider text-slate-400">
              02. 拍攝或選擇兩張照片 (1:1)
            </label>
            <span class="text-[11px] text-indigo-600 font-semibold">自動裁切壓縮</span>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <!-- 選項 A -->
            <div class="space-y-2">
              <div onclick="document.getElementById('file-a').click()"
                class="relative aspect-square w-full rounded-2xl border-2 border-dashed border-slate-300 bg-slate-50 hover:bg-indigo-50/40 hover:border-indigo-400 transition cursor-pointer overflow-hidden flex flex-col items-center justify-center group">
                <img id="preview-a" class="hidden w-full h-full object-cover" />
                <div id="placeholder-a" class="flex flex-col items-center text-center p-3">
                  <div class="w-11 h-11 rounded-full bg-white shadow-sm flex items-center justify-center text-indigo-600 mb-2 group-hover:scale-110 transition">
                    <i data-lucide="camera" class="w-5 h-5"></i>
                  </div>
                  <span class="text-xs font-bold text-slate-700">拍攝選項 A</span>
                  <span class="text-[10px] text-slate-400 mt-0.5">點擊開啟相機</span>
                </div>
                <span class="absolute top-2 left-2 w-6 h-6 rounded-lg bg-indigo-600 text-white text-xs font-black flex items-center justify-center shadow">A</span>
              </div>
              <input id="file-a" type="file" accept="image/*" capture="environment" class="hidden" onchange="handleImageUpload(event, 'A')" />
              <input id="label-a" type="text" maxlength="16" placeholder="選項 A 名稱 (選填)"
                class="w-full px-3 py-2 text-xs rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-indigo-500" />
            </div>

            <!-- 選項 B -->
            <div class="space-y-2">
              <div onclick="document.getElementById('file-b').click()"
                class="relative aspect-square w-full rounded-2xl border-2 border-dashed border-slate-300 bg-slate-50 hover:bg-rose-50/40 hover:border-rose-400 transition cursor-pointer overflow-hidden flex flex-col items-center justify-center group">
                <img id="preview-b" class="hidden w-full h-full object-cover" />
                <div id="placeholder-b" class="flex flex-col items-center text-center p-3">
                  <div class="w-11 h-11 rounded-full bg-white shadow-sm flex items-center justify-center text-rose-500 mb-2 group-hover:scale-110 transition">
                    <i data-lucide="camera" class="w-5 h-5"></i>
                  </div>
                  <span class="text-xs font-bold text-slate-700">拍攝選項 B</span>
                  <span class="text-[10px] text-slate-400 mt-0.5">點擊開啟相機</span>
                </div>
                <span class="absolute top-2 left-2 w-6 h-6 rounded-lg bg-rose-500 text-white text-xs font-black flex items-center justify-center shadow">B</span>
              </div>
              <input id="file-b" type="file" accept="image/*" capture="environment" class="hidden" onchange="handleImageUpload(event, 'B')" />
              <input id="label-b" type="text" maxlength="16" placeholder="選項 B 名稱 (選填)"
                class="w-full px-3 py-2 text-xs rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-rose-500" />
            </div>
          </div>
        </div>

        <!-- 截止時間設定 -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-xs font-bold uppercase tracking-wider text-slate-400">
              03. 設定開票截止時間
            </label>
            <div class="flex gap-1">
              <button type="button" onclick="setQuickDeadline(10)" class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-slate-100 hover:bg-indigo-100 hover:text-indigo-700 text-slate-600 transition">+10分</button>
              <button type="button" onclick="setQuickDeadline(30)" class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-slate-100 hover:bg-indigo-100 hover:text-indigo-700 text-slate-600 transition">+30分</button>
              <button type="button" onclick="setQuickDeadline(60)" class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-slate-100 hover:bg-indigo-100 hover:text-indigo-700 text-slate-600 transition">+1小時</button>
            </div>
          </div>
          <input id="input-deadline" type="datetime-local"
            class="w-full px-4 py-3 rounded-2xl bg-slate-50 border border-slate-200 text-slate-800 font-bold text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition" />
        </div>

        <!-- 建立按鈕 -->
        <button id="btn-create" onclick="submitCreatePoll()"
          class="w-full py-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-black text-base shadow-lg shadow-indigo-200 active:scale-[0.98] transition flex items-center justify-center gap-2">
          <i data-lucide="sparkles" class="w-5 h-5"></i>
          <span>建立投票並產生分享連結</span>
        </button>
      </div>

      <!-- CodePen / 測試快速載入區 -->
      <div class="glass-card rounded-2xl p-4 flex items-center gap-2">
        <input id="input-jump-id" type="text" placeholder="輸入 Poll ID 測試載入 (如 P171...)"
          class="flex-1 px-3 py-2 text-xs rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-indigo-500" />
        <button onclick="jumpToPollById()" class="px-3.5 py-2 rounded-xl bg-slate-800 text-white text-xs font-bold hover:bg-slate-700 transition">
          前往投票
        </button>
      </div>
    </section>

    <!-- ==================== 視圖 2：投票與開票模式 ==================== -->
    <section id="view-poll" class="hidden space-y-4">

      <!-- 隱藏管理員控制列 (連點右上角 5 下解鎖) -->
      <div id="admin-panel" class="hidden rounded-2xl bg-amber-50 border border-amber-300 p-3.5 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping"></span>
          <span class="text-xs font-black text-amber-900">管理員模式已解鎖</span>
        </div>
        <button id="btn-force-close" onclick="forceClosePoll()"
          class="px-3 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs font-black shadow-sm active:scale-95 transition">
          立即強制開票
        </button>
      </div>

      <!-- 題目與倒數計時卡片 -->
      <div class="glass-card rounded-3xl p-5 shadow-sm text-center space-y-3">
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold" id="status-badge">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span id="status-text">投票進行中</span>
        </div>

        <h2 id="poll-title" class="text-xl font-black text-slate-900 leading-snug">
          載入投票題目中...
        </h2>

        <!-- 倒數計時器 -->
        <div class="bg-slate-900 text-white rounded-2xl py-2.5 px-4 flex items-center justify-between">
          <div class="flex items-center gap-1.5 text-slate-400 text-xs font-semibold">
            <i data-lucide="clock" class="w-4 h-4 text-indigo-400"></i>
            <span id="countdown-label">距離開票還有</span>
          </div>
          <div id="countdown-timer" class="font-mono text-base font-extrabold tracking-wider text-amber-300">
            --:--:--
          </div>
        </div>
      </div>

      <!-- 二選一圖片卡片區 -->
      <div class="grid grid-cols-2 gap-3">
        <!-- 選項 A 卡片 -->
        <div id="card-a" onclick="castVote('A')"
          class="glass-card rounded-3xl p-2.5 shadow-sm cursor-pointer hover:border-indigo-400 active:scale-[0.98] transition flex flex-col justify-between relative overflow-hidden">
          <div class="relative aspect-square w-full rounded-2xl overflow-hidden bg-slate-100">
            <img id="img-a" src="" alt="選項 A" class="w-full h-full object-cover" />
            <span class="absolute top-2 left-2 w-7 h-7 rounded-xl bg-indigo-600 text-white text-sm font-black flex items-center justify-center shadow-md">A</span>
            <div id="winner-badge-a" class="hidden absolute inset-0 bg-emerald-600/20 flex items-center justify-center">
              <span class="px-3 py-1 rounded-full bg-emerald-500 text-white text-xs font-black shadow-lg flex items-center gap-1">
                <i data-lucide="trophy" class="w-3.5 h-3.5"></i> 優勝勝出
              </span>
            </div>
          </div>

          <div class="pt-3 pb-1 px-1 text-center">
            <p id="name-a" class="text-sm font-extrabold text-slate-800 truncate">選項 A</p>
            <button id="vote-btn-a" class="mt-2 w-full py-2 rounded-xl bg-indigo-50 text-indigo-700 font-black text-xs hover:bg-indigo-600 hover:text-white transition">
              投給 A
            </button>
            <!-- 開票結果數據 -->
            <div id="result-a" class="hidden mt-2 space-y-1">
              <div class="flex justify-between text-xs font-black">
                <span class="text-indigo-600" id="pct-a">0%</span>
                <span class="text-slate-500" id="votes-a">0 票</span>
              </div>
              <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                <div id="bar-a" class="h-full bg-indigo-600 rounded-full transition-all duration-700" style="width: 0%"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- 選項 B 卡片 -->
        <div id="card-b" onclick="castVote('B')"
          class="glass-card rounded-3xl p-2.5 shadow-sm cursor-pointer hover:border-rose-400 active:scale-[0.98] transition flex flex-col justify-between relative overflow-hidden">
          <div class="relative aspect-square w-full rounded-2xl overflow-hidden bg-slate-100">
            <img id="img-b" src="" alt="選項 B" class="w-full h-full object-cover" />
            <span class="absolute top-2 left-2 w-7 h-7 rounded-xl bg-rose-500 text-white text-sm font-black flex items-center justify-center shadow-md">B</span>
            <div id="winner-badge-b" class="hidden absolute inset-0 bg-emerald-600/20 flex items-center justify-center">
              <span class="px-3 py-1 rounded-full bg-emerald-500 text-white text-xs font-black shadow-lg flex items-center gap-1">
                <i data-lucide="trophy" class="w-3.5 h-3.5"></i> 優勝勝出
              </span>
            </div>
          </div>

          <div class="pt-3 pb-1 px-1 text-center">
            <p id="name-b" class="text-sm font-extrabold text-slate-800 truncate">選項 B</p>
            <button id="vote-btn-b" class="mt-2 w-full py-2 rounded-xl bg-rose-50 text-rose-600 font-black text-xs hover:bg-rose-500 hover:text-white transition">
              投給 B
            </button>
            <!-- 開票結果數據 -->
            <div id="result-b" class="hidden mt-2 space-y-1">
              <div class="flex justify-between text-xs font-black">
                <span class="text-rose-500" id="pct-b">0%</span>
                <span class="text-slate-500" id="votes-b">0 票</span>
              </div>
              <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                <div id="bar-b" class="h-full bg-rose-500 rounded-full transition-all duration-700" style="width: 0%"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 已投票提示 -->
      <div id="voted-notice" class="hidden rounded-2xl bg-indigo-50 border border-indigo-200 p-3 text-center text-xs font-bold text-indigo-800">
        ✅ 你已完成投票！結果將於截止時間一到自動揭曉。
      </div>

      <!-- 分享連結卡片 -->
      <div class="glass-card rounded-3xl p-4 shadow-sm space-y-2.5">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-slate-500">分享專屬連結給朋友投票</span>
          <span id="display-poll-id" class="text-[11px] font-mono font-bold text-slate-400"></span>
        </div>
        <div class="flex gap-2">
          <input id="share-url-input" type="text" readonly
            class="flex-1 px-3 py-2.5 rounded-xl bg-slate-100 text-slate-600 text-xs font-mono focus:outline-none" />
          <button onclick="copyShareUrl()"
            class="px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold flex items-center gap-1.5 active:scale-95 transition">
            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
            <span>複製</span>
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- 全螢幕 Loading 遮罩 -->
  <div id="loading-overlay" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center">
    <div class="bg-white rounded-3xl p-6 max-w-xs w-full shadow-2xl flex flex-col items-center space-y-3">
      <div class="w-12 h-12 border-4 border-indigo-100 border-t-indigo-600 rounded-full animate-spin"></div>
      <p id="loading-text" class="text-sm font-black text-slate-800">資料處理中...</p>
      <p class="text-xs text-slate-400">正在與 Google 雲端同步</p>
    </div>
  </div>

  <!-- Toast 提示訊息 -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-300 translate-y-2">
    <div id="toast-msg" class="px-4 py-2.5 rounded-full bg-slate-900 text-white text-xs font-bold shadow-xl whitespace-nowrap">
      提示訊息
    </div>
  </div>

  <script>
    // ==========================================
    // 1. 核心設定與狀態變數
    // ==========================================
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxGqnBTKQYEhmff7n_dKB_bLCkPupFH0UpqQ7ujYfdEBdNV991bjiLQEbuRak6aUg-b/exec";

    let base64A = "";
    let base64B = "";
    let currentPollId = null;
    let currentPollData = null;
    let countdownInterval = null;
    let secretTapCount = 0;
    let secretTapTimer = null;

    // 初始化圖示與預設時間
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      setQuickDeadline(30); // 預設 30 分鐘後開票

      // 檢查網址是否有 ?poll=P... 參數
      const params = new URLSearchParams(window.location.search);
      const pollId = params.get("poll");
      if (pollId) {
        loadPoll(pollId);
      }
    });

    // ==========================================
    // 2. 工具函式 (Loading / Toast / 預設時間)
    // ==========================================
    function showLoading(text = "資料同步中...") {
      document.getElementById("loading-text").textContent = text;
      document.getElementById("loading-overlay").classList.remove("hidden");
    }

    function hideLoading() {
      document.getElementById("loading-overlay").classList.add("hidden");
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      document.getElementById("toast-msg").textContent = msg;
      toast.classList.remove("opacity-0", "translate-y-2");
      setTimeout(() => {
        toast.classList.add("opacity-0", "translate-y-2");
      }, 2800);
    }

    function setQuickDeadline(minutesToAdd) {
      const now = new Date(Date.now() + minutesToAdd * 60000);
      const tzOffset = now.getTimezoneOffset() * 60000;
      const localISOTime = new Date(now - tzOffset).toISOString().slice(0, 16);
      document.getElementById("input-deadline").value = localISOTime;
    }

    // ==========================================
    // 3. 手機拍照與 Canvas 1:1 置中裁切壓縮 (800px)
    // ==========================================
    function handleImageUpload(event, option) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          const canvas = document.createElement("canvas");
          const TARGET_SIZE = 800;
          canvas.width = TARGET_SIZE;
          canvas.height = TARGET_SIZE;
          const ctx = canvas.getContext("2d");

          // 計算 1:1 置中裁切區域
          const minSide = Math.min(img.width, img.height);
          const sx = (img.width - minSide) / 2;
          const sy = (img.height - minSide) / 2;

          ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, TARGET_SIZE, TARGET_SIZE);

          // 輸出壓縮後的 JPEG Base64
          const compressedDataUrl = canvas.toDataURL("image/jpeg", 0.8);

          if (option === "A") {
            base64A = compressedDataUrl;
            document.getElementById("preview-a").src = compressedDataUrl;
            document.getElementById("preview-a").classList.remove("hidden");
            document.getElementById("placeholder-a").classList.add("hidden");
          } else {
            base64B = compressedDataUrl;
            document.getElementById("preview-b").src = compressedDataUrl;
            document.getElementById("preview-b").classList.remove("hidden");
            document.getElementById("placeholder-b").classList.add("hidden");
          }
          showToast(`選項 ${option} 照片已裁切壓縮完成`);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // ==========================================
    // 4. 建立投票 (POST 到 GAS)
    // ==========================================
    async function submitCreatePoll() {
      const title = document.getElementById("input-title").value.trim();
      const labelA = document.getElementById("label-a").value.trim() || "選項 A";
      const labelB = document.getElementById("label-b").value.trim() || "選項 B";
      const deadlineVal = document.getElementById("input-deadline").value;

      if (!title) return showToast("⚠️ 請輸入投票題目！");
      if (!base64A || !base64B) return showToast("⚠️ 請先拍攝或選擇 A、B 兩張照片！");
      if (!deadlineVal) return showToast("⚠️ 請設定開票截止時間！");

      const deadlineTimestamp = new Date(deadlineVal).getTime();
      if (deadlineTimestamp <= Date.now()) {
        return showToast("⚠️ 截止時間必須晚於現在時間！");
      }

      showLoading("正在上傳照片並建立投票...");

      try {
        const payload = {
          action: "create",
          title: title,
          labelA: labelA,
          labelB: labelB,
          imageA: base64A,
          imageB: base64B,
          deadline: new Date(deadlineVal).toISOString()
        };

        const response = await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        hideLoading();

        if (result.status === "success" || result.pollId) {
          const newPollId = result.pollId || result.data?.pollId;
          showToast("🎉 投票建立成功！");
          updateBrowserUrl(newPollId);
          loadPoll(newPollId);
        } else {
          throw new Error(result.message || "建立失敗");
        }
      } catch (err) {
        hideLoading();
        console.error(err);
        showToast("❌ 建立失敗：" + err.message);
      }
    }

    // 安全更新網址列（相容 CodePen iframe 沙盒環境）
    function updateBrowserUrl(pollId) {
      try {
        const url = new URL(window.location.href);
        if (pollId) {
          url.searchParams.set("poll", pollId);
        } else {
          url.searchParams.delete("poll");
        }
        window.history.pushState({}, "", url.toString());
      } catch (e) {
        // CodePen iframe 可能限制 pushState，忽略錯誤不影響功能
      }
    }

    function switchToCreateMode() {
      if (countdownInterval) clearInterval(countdownInterval);
      currentPollId = null;
      updateBrowserUrl(null);
      document.getElementById("view-poll").classList.add("hidden");
      document.getElementById("view-create").classList.remove("hidden");
      document.getElementById("btn-new-poll-top").classList.add("hidden");
      document.getElementById("admin-panel").classList.add("hidden");
    }

    function jumpToPollById() {
      const id = document.getElementById("input-jump-id").value.trim();
      if (!id) return showToast("請輸入 Poll ID");
      loadPoll(id);
    }

    // ==========================================
    // 5. 讀取投票資料與渲染畫面 (GET 從 GAS)
    // ==========================================
    async function loadPoll(pollId) {
      showLoading("正在載入投票內容...");
      currentPollId = pollId;

      try {
        const response = await fetch(`${GAS_API_URL}?action=get&pollId=${encodeURIComponent(pollId)}`);
        const res = await response.json();
        hideLoading();

        // 相容常見 GAS 回傳結構 (res.data 或直接回傳物件)
        const data = res.data || res;
        if (!data || (!data.title && res.status === "error")) {
          showToast("❌ 找不到此投票或已被刪除");
          return;
        }

        currentPollData = data;
        renderPollView(data);
      } catch (err) {
        hideLoading();
        console.error(err);
        showToast("❌ 讀取投票資料失敗");
      }
    }

    function renderPollView(data) {
      document.getElementById("view-create").classList.add("hidden");
      document.getElementById("view-poll").classList.remove("hidden");
      document.getElementById("btn-new-poll-top").classList.remove("hidden");

      document.getElementById("poll-title").textContent = data.title || "二選一投票";
      document.getElementById("name-a").textContent = data.labelA || "選項 A";
      document.getElementById("name-b").textContent = data.labelB || "選項 B";
      document.getElementById("img-a").src = data.imageA || data.imgA || "";
      document.getElementById("img-b").src = data.imageB || data.imgB || "";
      document.getElementById("display-poll-id").textContent = `ID: ${currentPollId}`;

      // 組合分享連結
      const baseUrl = window.location.href.split("?")[0];
      document.getElementById("share-url-input").value = `${baseUrl}?poll=${currentPollId}`;

      // 檢查本地是否已投過票
      const hasVoted = localStorage.getItem(`snapvote_voted_${currentPollId}`);
      if (hasVoted) {
        document.getElementById("voted-notice").classList.remove("hidden");
      } else {
        document.getElementById("voted-notice").classList.add("hidden");
      }

      // 啟動倒數與狀態判斷
      startCountdownAndCheckStatus(data);
    }

    // ==========================================
    // 6. 即時倒數計時與自動開票鎖定
    // ==========================================
    function startCountdownAndCheckStatus(data) {
      if (countdownInterval) clearInterval(countdownInterval);

      const deadlineTime = new Date(data.deadline).getTime();

      function tick() {
        const now = Date.now();
        const diff = deadlineTime - now;
        const isClosed = data.status === "CLOSED" || data.status === "closed" || diff <= 0;

        if (isClosed) {
          clearInterval(countdownInterval);
          showRevealedResults(data);
          return;
        }

        // 更新倒數計時顯示
        const hours = Math.floor(diff / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById("countdown-timer").textContent =
          `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;

        // 確保為投票中 UI
        const hasVoted = localStorage.getItem(`snapvote_voted_${currentPollId}`);
        document.getElementById("vote-btn-a").classList.remove("hidden");
        document.getElementById("vote-btn-b").classList.remove("hidden");
        document.getElementById("result-a").classList.add("hidden");
        document.getElementById("result-b").classList.add("hidden");

        if (hasVoted) {
          document.getElementById("vote-btn-a").textContent = hasVoted === "A" ? "已投給 A" : "已投票";
          document.getElementById("vote-btn-b").textContent = hasVoted === "B" ? "已投給 B" : "已投票";
          document.getElementById("vote-btn-a").disabled = true;
          document.getElementById("vote-btn-b").disabled = true;
        }
      }

      tick();
      countdownInterval = setInterval(tick, 1000);
    }

    // 顯示開票結果畫面
    function showRevealedResults(data) {
      const statusBadge = document.getElementById("status-badge");
      statusBadge.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-rose-100 text-rose-700";
      statusBadge.innerHTML = `<i data-lucide="lock" class="w-3.5 h-3.5"></i><span>已截止・開票結果揭曉</span>`;
      lucide.createIcons();

      document.getElementById("countdown-label").textContent = "投票狀態";
      document.getElementById("countdown-timer").textContent = "已結束開票";
      document.getElementById("countdown-timer").classList.replace("text-amber-300", "text-emerald-400");
      document.getElementById("voted-notice").classList.add("hidden");

      // 隱藏投票按鈕、顯示票數條
      document.getElementById("vote-btn-a").classList.add("hidden");
      document.getElementById("vote-btn-b").classList.add("hidden");
      document.getElementById("result-a").classList.remove("hidden");
      document.getElementById("result-b").classList.remove("hidden");

      const votesA = Number(data.votesA || 0);
      const votesB = Number(data.votesB || 0);
      const total = votesA + votesB;

      const pctA = total === 0 ? 0 : Math.round((votesA / total) * 100);
      const pctB = total === 0 ? 0 : Math.round((votesB / total) * 100);

      document.getElementById("pct-a").textContent = `${pctA}%`;
      document.getElementById("votes-a").textContent = `${votesA} 票`;
      document.getElementById("bar-a").style.width = `${pctA}%`;

      document.getElementById("pct-b").textContent = `${pctB}%`;
      document.getElementById("votes-b").textContent = `${votesB} 票`;
      document.getElementById("bar-b").style.width = `${pctB}%`;

      // 標記優勝者皇冠與發光外框
      document.getElementById("card-a").classList.remove("winner-glow");
      document.getElementById("card-b").classList.remove("winner-glow");
      document.getElementById("winner-badge-a").classList.add("hidden");
      document.getElementById("winner-badge-b").classList.add("hidden");

      if (votesA > votesB) {
        document.getElementById("card-a").classList.add("winner-glow");
        document.getElementById("winner-badge-a").classList.remove("hidden");
      } else if (votesB > votesA) {
        document.getElementById("card-b").classList.add("winner-glow");
        document.getElementById("winner-badge-b").classList.remove("hidden");
      }
    }

    // ==========================================
    // 7. 進行投票 (POST 到 GAS)
    // ==========================================
    async function castVote(choice) {
      if (!currentPollId || !currentPollData) return;

      // 檢查是否已結束
      const isClosed = currentPollData.status === "CLOSED" || new Date(currentPollData.deadline).getTime() <= Date.now();
      if (isClosed) {
        return showToast("🔒 投票已結束，無法再投票！");
      }

      // 檢查是否重複投票
      if (localStorage.getItem(`snapvote_voted_${currentPollId}`)) {
        return showToast("⚠️ 你已經投過票囉！");
      }

      showLoading(`正在送出你的選擇 (${choice})...`);

      try {
        const response = await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "vote",
            pollId: currentPollId,
            option: choice
          })
        });

        const res = await response.json();
        hideLoading();

        if (res.status === "success" || res.data) {
          localStorage.setItem(`snapvote_voted_${currentPollId}`, choice);
          showToast(`🎉 成功投給選項 ${choice}！`);
          loadPoll(currentPollId); // 重新同步最新狀態
        } else {
          throw new Error(res.message || "投票失敗");
        }
      } catch (err) {
        hideLoading();
        showToast("❌ 投票失敗：" + err.message);
      }
    }

    // ==========================================
    // 8. 右上角隱藏彩蛋：房主強制提前開票
    // ==========================================
    function handleSecretTap() {
      if (!currentPollId) {
        showToast("💡 進入投票頁面後連點 5 下可開啟管理員面板");
        return;
      }

      secretTapCount++;
      clearTimeout(secretTapTimer);
      secretTapTimer = setTimeout(() => { secretTapCount = 0; }, 1500);

      if (secretTapCount >= 5) {
        secretTapCount = 0;
        const adminPanel = document.getElementById("admin-panel");
        adminPanel.classList.toggle("hidden");
        showToast("🔓 已切換管理員控制面板");
      }
    }

    async function forceClosePoll() {
      if (!currentPollId) return;
      if (!confirm("確定要立即提前結束投票並公布開票結果嗎？")) return;

      showLoading("正在執行強制開票...");

      try {
        const response = await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "close",
            pollId: currentPollId
          })
        });

        const res = await response.json();
        hideLoading();

        if (res.status === "success" || res.data) {
          showToast("📢 已提前開票並鎖定結果！");
          document.getElementById("admin-panel").classList.add("hidden");
          loadPoll(currentPollId);
        } else {
          throw new Error(res.message || "開票操作失敗");
        }
      } catch (err) {
        hideLoading();
        showToast("❌ 開票失敗：" + err.message);
      }
    }

    // ==========================================
    // 9. 複製分享連結
    // ==========================================
    function copyShareUrl() {
      const input = document.getElementById("share-url-input");
      input.select();
      input.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(input.value).then(() => {
        showToast("📋 已複製投票連結，快貼到群組吧！");
      }).catch(() => {
        document.execCommand("copy");
        showToast("📋 已複製投票連結！");
      });
    }
  </script>
</body>
